<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Health Monitoring Dashboards for North Batinah Governorate (NBG) — Women & Child Health Department, Ministry of Health Oman. Data 2023, 2024 & 2025."
    />
    <!-- Link previews (WhatsApp, Teams, LinkedIn, X…). og:url and og:image
         need an absolute address, so vite.config.ts adds them at build time
         when the site's URL is known (Vercel / Netlify / SITE_URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NBG Health Dashboards" />
    <meta property="og:title" content="Women &amp; Child Health Dashboards — North Al Batinah" />
    <meta
      property="og:description"
      content="Ministry of Health, Oman · Women &amp; Child Health Department. Monitoring indicators 2023–2025, 2025 population estimates and a health-centre map for North Al Batinah Governorate."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="ar_OM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- PWA: installable standalone app. All additive — these tags are inert on
         desktop browsers, so the desktop/PC experience is unchanged. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NBG-OM" />
    <!-- Apply the saved/system theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nbg-theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable — default to light */
        }
      })()
    </script>
    <title>NBG Health Dashboards — Women &amp; Child Health (2023–2025)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
